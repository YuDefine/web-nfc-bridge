name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  app:
    name: app-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test build scripts
        run: pnpm run test:scripts

      - name: Build Nuxt app
        run: pnpm run build:app

  connector:
    name: connector-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install PC/SC library
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev

      - name: Run connector tests
        run: go test ./connector/...

      # Windows-only files (log_windows.go, direct_driver_windows.go, ...) are
      # not compiled by the Linux test run above.
      - name: Vet Windows builds
        run: |
          GOOS=windows GOARCH=amd64 go vet ./connector/...
          GOOS=windows GOARCH=arm64 go vet ./connector/...

  connector-test-windows:
    name: connector-test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows-only code (file logging, crash output, Direct IOCTL driver)
        # only runs on real Windows, on both shipped architectures.
        os: [windows-latest, windows-11-arm]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run connector tests
        run: go test ./connector/...

